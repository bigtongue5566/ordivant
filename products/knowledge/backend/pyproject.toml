[project]
name = "ordivant-knowledge"
version = "0.3.0"
description = "Independent Ordivant Knowledge API and MCP server"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.8,<3",
  "httpx>=0.27,<1",
  "mcp>=1.12,<2",
  "pycrdt>=0.12,<0.13",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ordivant_knowledge"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
