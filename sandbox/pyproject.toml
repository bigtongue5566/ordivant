[project]
name = "ordivant-sandbox-api"
version = "0.4.0"
description = "Isolated per-run Docker executor for Ordivant"
requires-python = ">=3.12,<3.13"
dependencies = [
  "docker>=7.1,<8",
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.34,<1",
]

[dependency-groups]
dev = [
  "httpx>=0.27,<1",
  "pytest>=9.0.3,<10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
