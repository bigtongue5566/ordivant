[project]
name = "ordivant-code-backend"
version = "0.5.0"
description = "Ordivant Code project, repository, pull request, and Gitea integration API"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "sqlalchemy>=2.0,<3",
  "psycopg[binary]>=3.2,<4",
  "httpx>=0.27,<1",
  "mcp>=1.12,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10",
]

[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ordivant_code"]

[tool.pytest.ini_options]
testpaths = ["tests"]
